name: Build & Web-Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: Firmware bauen
        run: pio run -e longdeck

      - name: Dateien zusammenstellen
        run: |
          mkdir -p site dist
          cp web/index.html web/manifest.json site/
          # Dateiname mit Commit-ID, damit Browser/CDN nie eine alte Firmware aus dem Cache liefern
          BIN="longdeck-${GITHUB_SHA::7}.bin"
          cp firmware/longdeck.bin "site/$BIN"
          sed -i "s/\"longdeck.bin\"/\"$BIN\"/" site/manifest.json
          cp firmware/longdeck.bin dist/longdeck-full.bin

      - uses: actions/upload-artifact@v4
        with:
          name: longdeck-firmware
          path: dist/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/longdeck-full.bin

  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
