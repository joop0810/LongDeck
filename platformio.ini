; LongDeck – Stream-Deck-Firmware für den LilyGO T-Display-S3-Long
; https://github.com/joop0810/LongDeck

[platformio]
default_envs = longdeck
boards_dir = ./boards

[env:longdeck]
platform = espressif32 @ 6.5.0
board = T-Display-Long
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; USB läuft im OTG/TinyUSB-Modus (ARDUINO_USB_MODE=0 in boards/T-Display-Long.json),
    ; damit das Board als Tastatur auftreten kann. Die serielle USB-Schnittstelle legt keys.cpp an.
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:tools/merge_bin.py
